{% extends 'food/base.html' %}

{% block body %}
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded">
            <div class="card-header bg-info text-white text-center">
                <h3 class="mb-0">Login</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" class="text-center">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="form-group mb-3 mx-auto" style="width: 80%;">
                            <label class="fw-bold d-block text-start">{{ field.label }}</label>
                            
                            {% if field.field.widget.input_type == "password" %}
                                <div class="input-group">
                                    <input type="password" name="{{ field.name }}" id="passwordField" class="form-control text-center" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            {% else %}
                                <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="form-control text-center" required>
                            {% endif %}
                            
                            {% if field.errors %}
                                <div class="text-danger small">
                                    {{ field.errors|striptags }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button class="btn btn-info w-75 text-white fw-bold mt-3" type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript for Password Toggle -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const togglePassword = document.getElementById("togglePassword");
        const passwordField = document.getElementById("passwordField");

        togglePassword.addEventListener("click", function () {
            const type = passwordField.type === "password" ? "text" : "password";
            passwordField.type = type;
            this.innerHTML = type === "password" ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
        });
    });
</script>

<!-- Include Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
{% endblock %}
